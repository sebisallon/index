                        <div className="bg-amber-500/10 p-1.5 rounded-full mr-4 flex-shrink-0"><Scissors className="w-4 h-4 text-amber-500" /></div>
                        <span className="text-sm md:text-base">{item}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>
            </div>
          </section>

          <section id="shërbimet" className="py-20 md:py-24 bg-zinc-900 border-y border-zinc-800">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-12 md:mb-16">
                <h2 className="text-amber-500 font-bold tracking-widest uppercase text-sm mb-3">Menuja e Shërbimeve</h2>
                <h3 className="text-3xl md:text-4xl font-bold text-white">Lista e Çmimeve</h3>
              </div>

              <div className="flex flex-wrap justify-center gap-2 mb-10">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setActiveTab(cat)}
                    className={`px-5 py-2 md:px-6 md:py-2.5 rounded-full text-xs md:text-sm font-bold uppercase tracking-wide transition-all ${
                      activeTab === cat ? 'bg-amber-500 text-zinc-950 shadow-lg shadow-amber-500/20' : 'bg-zinc-800 text-zinc-400 hover:bg-zinc-700 hover:text-white'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="space-y-4 md:space-y-6">
                {filteredServices.map((service, index) => (
                  <div key={index} className="group relative bg-zinc-950/50 p-5 md:p-6 rounded-xl border border-zinc-800/50 hover:border-amber-500/50 transition-colors">
                    <div className="flex justify-between items-end mb-2">
                      <h4 className="text-lg md:text-xl font-bold text-white group-hover:text-amber-500 transition-colors">{service.name}</h4>
                      <div className="hidden sm:block flex-1 border-b-2 border-dashed border-zinc-700 mx-4 relative bottom-2 opacity-30"></div>
                      <span className="text-lg md:text-xl font-bold text-amber-500 whitespace-nowrap ml-4">{service.price}</span>
                    </div>
                    <p className="text-zinc-500 text-xs md:text-sm">{service.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <section id="galeria" className="py-20 md:py-24 bg-zinc-950 relative">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-12 md:mb-16">
                <h2 className="text-amber-500 font-bold tracking-widest uppercase text-sm mb-3">Portofoli Jonë</h2>
                <h3 className="text-3xl md:text-4xl font-bold text-white">Pamje nga Salloni</h3>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-6">
                {visibleGalleryImages.map((src, idx) => (
                  <div key={idx} onClick={() => openLightbox(idx)} className="group relative overflow-hidden rounded-xl aspect-[4/5] bg-zinc-900 cursor-pointer border border-zinc-800 hover:border-amber-500/50 transition-all">
                    <img src={src} alt={`Galeria ${idx + 1}`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-90 group-hover:opacity-100" />
                    <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors flex items-center justify-center">
                       <span className="opacity-0 group-hover:opacity-100 text-white font-medium bg-black/50 px-4 py-2 rounded-full backdrop-blur-sm transition-opacity duration-300 scale-95 group-hover:scale-100">Shiko</span>
                    </div>
                  </div>
                ))}
              </div>
              
              <div className="text-center mt-10">
                 <p className="text-zinc-500 text-sm">Klikoni një foto për të parë të gjithë galerinë.</p>
              </div>
            </div>
          </section>

          <section id="vlerësime" className="py-20 md:py-24 bg-zinc-900 border-t border-zinc-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-12 md:mb-16">
                <h2 className="text-amber-500 font-bold tracking-widest uppercase text-sm mb-3">Çfarë thonë klientët</h2>
                <h3 className="text-3xl md:text-4xl font-bold text-white">Vlerësimet në Google</h3>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                {reviews.map((review, index) => (
                  <div key={index} className="bg-zinc-950/60 p-8 rounded-2xl border border-zinc-800/60 hover:border-amber-500/30 transition-all flex flex-col">
                    <div className="flex space-x-1 mb-6">
                      {[...Array(5)].map((_, i) => <Star key={i} className="w-4 h-4 text-amber-500" />)}
                    </div>
                    <p className="text-zinc-300 mb-8 italic flex-1">"{review.text}"</p>
                    <div className="flex items-center">
                      <div className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center text-amber-500 font-bold text-lg mr-3">
                        {review.name.charAt(0)}
                      </div>
                      <span className="font-bold text-white">{review.name}</span>
                    </div>
                  </div>
                ))}
              </div>

              <div className="text-center">
                <a href={mapUrl} target="_blank" rel="noreferrer" className="inline-flex items-center justify-center bg-white hover:bg-zinc-200 text-zinc-900 font-bold px-8 py-3.5 rounded-full transition-all transform hover:-translate-y-1 shadow-lg">
                  <GoogleIcon className="w-5 h-5 mr-3" /> Lexo të gjitha vlerësimet në Google
                </a>
              </div>
            </div>
          </section>

          {lightboxIndex !== null && (
            <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex flex-col items-center justify-center touch-none" onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEndHandler}>
              <div className="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-50 bg-gradient-to-b from-black/80 to-transparent">
                <span className="text-zinc-400 text-sm font-medium px-2">{lightboxIndex + 1} / {galleryImages.length}</span>
                <button onClick={closeLightbox} className="p-2 bg-zinc-900/80 hover:bg-amber-500 hover:text-black text-white rounded-full transition-colors"><XIcon className="w-6 h-6" /></button>
              </div>
              <button onClick={prevImage} className="hidden md:flex absolute left-4 p-3 bg-zinc-900/50 hover:bg-amber-500 hover:text-black text-white rounded-full transition-colors z-50"><ChevronLeft className="w-8 h-8" /></button>
              <div className="w-full h-full p-4 flex items-center justify-center outline-none">
                <img src={galleryImages[lightboxIndex]} alt="Zmadhuar" className="max-w-full max-h-[85vh] object-contain rounded-md shadow-2xl transition-transform" />
              </div>
              <button onClick={nextImage} className="hidden md:flex absolute right-4 p-3 bg-zinc-900/50 hover:bg-amber-500 hover:text-black text-white rounded-full transition-colors z-50"><ChevronRight className="w-8 h-8" /></button>
              <div className="md:hidden absolute bottom-6 text-zinc-500 text-xs font-medium tracking-wide">Bëj swipe për të kaluar {galleryImages.length} fotot</div>
            </div>
          )}

          <footer id="kontakt" className="bg-zinc-950 border-t border-zinc-800 pt-16 pb-8 md:pt-20 md:pb-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-10 md:gap-12 mb-12 md:mb-16">
                <div>
                  <div className="flex items-center mb-6">
                    <Scissors className="h-8 w-8 text-amber-500 mr-2" />
                    <span className="text-2xl font-bold tracking-wider text-white uppercase">Sebi<span className="text-amber-500">Sallon</span></span>
                  </div>
                  <p className="text-zinc-400 mb-6 text-sm md:text-base leading-relaxed">
                    Stili juaj është prioriteti ynë. Ofrojmë prerje dhe stilime të një cilësie të lartë në një ambient ku çdo detaj flet për perfeksion.
                  </p>
                  <div className="flex space-x-3">
                    <a href="https://www.instagram.com/sebi_sallon/" target="_blank" rel="noreferrer" className="bg-zinc-900 border border-zinc-800 p-3 rounded-full text-zinc-400 hover:text-amber-500 hover:border-amber-500/50 transition-all"><Instagram className="w-5 h-5" /></a>
                    <a href="#" className="bg-zinc-900 border border-zinc-800 p-3 rounded-full text-zinc-400 hover:text-amber-500 hover:border-amber-500/50 transition-all"><Facebook className="w-5 h-5" /></a>
                    <a href="#" className="bg-zinc-900 border border-zinc-800 p-3 rounded-full text-zinc-400 hover:text-amber-500 hover:border-amber-500/50 transition-all"><Youtube className="w-5 h-5" /></a>
                  </div>
                </div>

                <div>
                  <h4 className="text-lg font-bold text-white uppercase tracking-wider mb-6">Informacion Kontakti</h4>
                  <ul className="space-y-5">
                    <li className="flex items-start text-zinc-400 text-sm md:text-base">
                      <MapPin className="w-5 h-5 text-amber-500 mr-3 mt-1 flex-shrink-0" />
                      <div className="flex flex-col">
                        <span className="mb-2">Te Rruga Ura, përballë Tower Bridge,<br/> Tiranë, Shqipëri</span>
                        <a href={mapUrl} target="_blank" rel="noreferrer" className="inline-flex items-center text-amber-500 hover:text-amber-400 font-medium text-sm border border-amber-500/30 hover:border-amber-500 bg-amber-500/10 px-3 py-1.5 rounded-md transition-all w-max">
                          Hap në Google Maps <ChevronRight className="w-4 h-4 ml-1" />
                        </a>
                      </div>
                    </li>
                    <li className="flex items-center text-zinc-400 text-sm md:text-base">
                      <Phone className="w-5 h-5 text-amber-500 mr-3 flex-shrink-0" />
                      <a href="tel:+355693633411" className="hover:text-amber-500 transition-colors">+355 69 363 3411</a>
                    </li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-lg font-bold text-white uppercase tracking-wider mb-6">Orari i Punës</h4>
                  <ul className="space-y-3 text-sm md:text-base">
                    <li className="flex justify-between text-zinc-400 border-b border-zinc-800 pb-2"><span>E Hënë - E Premte</span><span className="text-white">08:00 - 22:00</span></li>
                    <li className="flex justify-between text-zinc-400 border-b border-zinc-800 pb-2"><span>E Shtunë</span><span className="text-white">08:00 - 22:00</span></li>
                    <li className="flex justify-between text-zinc-400 pb-2"><span>E Dielë</span><span className="text-white">08:00 - 22:00</span></li>
                  </ul>
                </div>
              </div>

              <div className="border-t border-zinc-800 pt-6 md:pt-8 flex flex-col md:flex-row justify-between items-center text-xs md:text-sm text-zinc-500 text-center md:text-left">
                <p>© {new Date().getFullYear()} Sebi Sallon. Të gjitha të drejtat e rezervuara.</p>
              </div>
            </div>
          </footer>

          <div className="md:hidden fixed bottom-0 left-0 w-full p-3 bg-zinc-950/90 backdrop-blur-md border-t border-zinc-800 z-40 flex gap-3">
            <a href="tel:+355693633411" className="flex-1 bg-zinc-800 text-white font-bold py-3.5 rounded-full flex justify-center items-center border border-zinc-700"><Phone className="w-5 h-5 text-amber-500" /></a>
            <a href="https://wa.me/355693633411" target="_blank" rel="noreferrer" className="flex-[3] bg-amber-500 text-zinc-950 font-bold py-3.5 rounded-full flex justify-center items-center shadow-[0_0_15px_rgba(245,158,11,0.2)]"><MessageCircle className="w-5 h-5 mr-2" /> Rezervo Tani</a>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
